<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CI Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --color-paper: #181818; --color-ink: #F2F5F3; --color-muted: #B7C2BB; --color-accent: #54B365; }
body { background: var(--color-paper); color: var(--color-ink); font-family: 'OpenSauceTwo', system-ui, sans-serif; padding: 2rem; }
.diagram-container { width: 100%; max-width: 560px; margin: 0 auto; overflow-x: auto; }
svg { width: 100%; min-width: 560px; display: block; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<div class="diagram-container">
<svg viewBox="0 0 560 508" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cli-ci-pipeline-title cli-ci-pipeline-desc">
<title id="cli-ci-pipeline-title">CI pipeline</title>
<desc id="cli-ci-pipeline-desc">A CI job authenticates with a repo secret, optionally runs doctor, runs all tests, and the exit code decides whether the job passes or fails.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B7C2BB"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#54B365"/></marker>
</defs>
<rect width="100%" height="100%" fill="#181818"/>
<path d="M134 80 V120" fill="none" stroke="#B7C2BB" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M134 176 V216" fill="none" stroke="#B7C2BB" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M134 272 V312" fill="none" stroke="#B7C2BB" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M244 244 H304" fill="none" stroke="#B7C2BB" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M214 352 H304" fill="none" stroke="#B7C2BB" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M420 380 V428" fill="none" stroke="#B7C2BB" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M134 392 V428" fill="none" stroke="#54B365" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="150" y="104" fill="#9AA69F" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.12em">OPTIONAL</text>
<text x="259" y="342" fill="#B7C2BB" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NON-ZERO</text>
<text x="146" y="415" fill="#54B365" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.06em">0</text>
<rect x="24" y="24" width="220" height="56" rx="6" fill="#181818"/>
<rect x="24" y="24" width="220" height="56" rx="6" fill="#222522" stroke="#F2F5F3" stroke-width="1"/>
<text x="134.0" y="48" fill="#F2F5F3" font-size="15.5" font-weight="600" font-family="'OpenSauceTwo', system-ui, sans-serif" text-anchor="middle">API key secret</text>
<text x="134.0" y="66" fill="#B7C2BB" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">TESTSPRITE_API_KEY</text>
<rect x="24" y="120" width="220" height="56" rx="6" fill="#181818"/>
<rect x="24" y="120" width="220" height="56" rx="6" fill="#222522" stroke="#F2F5F3" stroke-width="1" stroke-dasharray="5,4"/>
<text x="134.0" y="144" fill="#F2F5F3" font-size="15.5" font-weight="600" font-family="'OpenSauceTwo', system-ui, sans-serif" text-anchor="middle">Preflight check</text>
<text x="134.0" y="162" fill="#B7C2BB" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">testsprite doctor</text>
<rect x="24" y="216" width="220" height="56" rx="6" fill="#181818"/>
<rect x="24" y="216" width="220" height="56" rx="6" fill="rgba(84,179,101,0.14)" stroke="#54B365" stroke-width="1.5"/>
<text x="134.0" y="240" fill="#F2F5F3" font-size="15.5" font-weight="600" font-family="'OpenSauceTwo', system-ui, sans-serif" text-anchor="middle">Run all tests</text>
<text x="134.0" y="258" fill="#B7C2BB" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">test run --all --wait</text>
<rect x="304" y="216" width="232" height="56" rx="6" fill="#181818"/>
<rect x="304" y="216" width="232" height="56" rx="6" fill="#222522" stroke="#F2F5F3" stroke-width="1"/>
<text x="420.0" y="240" fill="#F2F5F3" font-size="15.5" font-weight="600" font-family="'OpenSauceTwo', system-ui, sans-serif" text-anchor="middle">Report, annotations</text>
<text x="420.0" y="258" fill="#B7C2BB" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">result.json</text>
<polygon points="134,312 214,352 134,392 54,352" fill="#181818"/>
<polygon points="134,312 214,352 134,392 54,352" fill="#222522" stroke="#F2F5F3" stroke-width="1"/>
<text x="134" y="357" fill="#F2F5F3" font-size="15.5" font-weight="600" font-family="'OpenSauceTwo', system-ui, sans-serif" text-anchor="middle">Exit code</text>
<rect x="304" y="324" width="232" height="56" rx="6" fill="#181818"/>
<rect x="304" y="324" width="232" height="56" rx="6" fill="#222522" stroke="#F2F5F3" stroke-width="1"/>
<text x="420.0" y="357.0" fill="#F2F5F3" font-size="15.5" font-weight="600" font-family="'OpenSauceTwo', system-ui, sans-serif" text-anchor="middle">Job fails</text>
<rect x="304" y="428" width="232" height="56" rx="6" fill="#181818"/>
<rect x="304" y="428" width="232" height="56" rx="6" fill="#222522" stroke="#F2F5F3" stroke-width="1"/>
<text x="420.0" y="452" fill="#F2F5F3" font-size="15.5" font-weight="600" font-family="'OpenSauceTwo', system-ui, sans-serif" text-anchor="middle">Failure bundles</text>
<text x="420.0" y="470" fill="#B7C2BB" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">as artifacts</text>
<rect x="24" y="428" width="220" height="56" rx="6" fill="#181818"/>
<rect x="24" y="428" width="220" height="56" rx="6" fill="rgba(84,179,101,0.14)" stroke="#54B365" stroke-width="1.5"/>
<text x="134.0" y="461.0" fill="#54B365" font-size="15.5" font-weight="600" font-family="'OpenSauceTwo', system-ui, sans-serif" text-anchor="middle">Job passes</text>
</svg>
</div>
</body>
</html>
